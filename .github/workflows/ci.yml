# The project's CI (K-LAYOUT-18): the review lane and the reconciler read its runs by this file
# name. `kanon init` started it with Kanon's lane check; the project's own gates follow, each as
# its own job ([DEV-1]). `## Gates` in docs/qa/stack.md lists the same commands in the same
# order ([DEV-2]), and tests/tooling/ci-gates.test.ts holds the two together.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lanes:
    name: Lane check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: yedeya-labs/kanon/actions/lane-check@v0.42.0

  # Each gate installs the project through the same project-setup hook the agent lanes call, so
  # a change that breaks the hook breaks CI before it breaks a lane.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/project-setup
        with:
          lane: ci
          install: "true"
          database: "false"
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/project-setup
        with:
          lane: ci
          install: "true"
          database: "false"
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/project-setup
        with:
          lane: ci
          install: "true"
          database: "true"
      - run: npm test

  # The schema check ([PLAT-11]): the committed migrations in drizzle/ hold every change to
  # src/db/schema/. It generates into a copy and reaches no database.
  schema:
    name: Schema check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/project-setup
        with:
          lane: ci
          install: "true"
          database: "false"
      - run: npm run db:check

  # The spec-coverage ratchet (#52): every invariant ID a test title cites is recorded in
  # docs/qa/specs/_locked-floor.json, and every ID recorded there is still cited, so the change
  # that moves one fails rather than a later lane. It runs the script of the Kanon release the
  # lane check pins, which reads the tree with node's built-ins alone and installs nothing.
  spec-coverage:
    name: Spec coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: yedeya-labs/kanon/actions/kanon-path@v0.42.0
      - run: node "$KANON/scripts/spec-coverage.mjs" --quiet
