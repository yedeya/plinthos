# The project-setup hook (docs/lanes.md): every lane that checks out calls it before the agent,
# and so does each of CI's gate jobs. It installs the Node.js version `.nvmrc` pins and the
# locked dependencies, and, given `database: 'true'`, starts the test PostgreSQL and writes
# `DATABASE_URL` to $GITHUB_ENV before it finishes ([DEV-4], [DEV-5], K-LAYOUT-16).
# tests/tooling/project-setup.test.ts holds it to that.
#
# The server is PostgreSQL 16, the major version of the Aurora engine the deployment runs; the
# test above fails when the two disagree. It starts before the dependencies install and is
# waited for after, so the two overlap. Its health check asks over TCP, which the image's
# first-boot initialisation server does not listen on, so "healthy" means the real server.
name: Project setup
description: Installs the project for an agent lane or a CI gate, with its test database when asked.
inputs:
  app-slug:
    description: Passed by Kanon's lanes (docs/lanes.md). Unused.
    default: ""
  browsers:
    description: Passed by Kanon's lanes (docs/lanes.md). Unused until the project has browser tests.
    default: ""
  database:
    description: "'true' starts the test PostgreSQL and writes DATABASE_URL (docs/qa/test-database.md)."
    default: "false"
  github-token:
    description: Passed by Kanon's lanes (docs/lanes.md). Unused.
    default: ""
  install:
    description: "'false' skips installing the dependencies; Kanon's lanes pass 'true'."
    default: "true"
  issue-number:
    description: Passed by Kanon's lanes (docs/lanes.md). Unused.
    default: ""
  lane:
    description: The lane's telemetry agent name, or `ci` for a CI gate.
    default: ""
runs:
  using: composite
  steps:
    - name: Start the test PostgreSQL
      if: inputs.database == 'true'
      shell: bash
      run: |
        docker rm -f test-database >/dev/null 2>&1 || true
        docker run -d --name test-database \
          -e POSTGRES_USER=plinthos -e POSTGRES_PASSWORD=plinthos -e POSTGRES_DB=plinthos \
          -p 5432:5432 \
          --health-cmd "pg_isready -h 127.0.0.1 -U plinthos -d plinthos" --health-interval 2s --health-timeout 3s --health-retries 30 \
          postgres:16-alpine >/dev/null

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install the locked dependencies
      if: inputs.install != 'false'
      shell: bash
      run: npm ci

    - name: Wait for the test PostgreSQL and write DATABASE_URL
      if: inputs.database == 'true'
      shell: bash
      run: |
        status=starting
        for _ in $(seq 60); do
          status="$(docker inspect -f '{{.State.Health.Status}}' test-database 2>/dev/null || echo gone)"
          [ "$status" = healthy ] && break
          { [ "$status" = unhealthy ] || [ "$status" = gone ]; } && break
          sleep 2
        done
        if [ "$status" != healthy ]; then
          echo "::error file=.github/actions/project-setup/action.yml::the test PostgreSQL is $status"
          docker logs test-database 2>&1 | tail -40
          exit 1
        fi
        echo "DATABASE_URL=postgres://plinthos:plinthos@localhost:5432/plinthos" >> "$GITHUB_ENV"
