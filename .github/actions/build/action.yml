# The deploy lane's build hook (docs/lanes.md, "The deploy lane"; [PLAT-4], K-SHIP-12). It runs
# with no credential and no secret: it builds the admin's Next.js app with OpenNext, from the
# checked-out commit, and copies what `sst deploy` reads into `output`. The deploy hook puts it
# back in place and deploys it as it is, so nothing is built beside a cloud credential.
# tests/infra/deploy-hooks.test.ts holds it to that.
name: Deploy lane build hook
description: "Builds what every environment deploys, from the checked-out commit, into the output directory. It runs with no credential and no secret."
inputs:
  output:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  release:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  sha:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
runs:
  using: composite
  steps:
    - name: Install the project
      uses: ./.github/actions/project-setup
      with:
        lane: deploy-build
        install: "true"
        database: "false"

    - name: Build the admin with OpenNext
      shell: bash
      env:
        NEXT_TELEMETRY_DISABLED: "1"
      run: npm run build

    # `.open-next/` is every function bundle and every asset; `sst.aws.Nextjs` also reads these
    # three files of `.next/` (its build id, routes and prerender manifests) and nothing else.
    - name: Copy the build into the output directory
      shell: bash
      env:
        OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        if [ -z "$OUTPUT" ]; then
          echo "::error file=.github/actions/build/action.yml::the lane passed no output directory"
          exit 1
        fi
        test -f .open-next/open-next.output.json
        mkdir -p "$OUTPUT/.next"
        cp -R .open-next "$OUTPUT/.open-next"
        cp .next/BUILD_ID .next/routes-manifest.json .next/prerender-manifest.json "$OUTPUT/.next/"
        # The artifact can't carry a link: fail here, by name, rather than at the upload.
        links="$(find "$OUTPUT" -type l)"
        if [ -n "$links" ]; then
          echo "::error file=.github/actions/build/action.yml::the build holds links the artifact can't carry: $links"
          exit 1
        fi
