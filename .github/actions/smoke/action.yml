  release:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  role:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "::error file=.github/actions/smoke/action.yml::.github/actions/smoke/action.yml is the stub kanon init wrote: replace its step with your smoke (docs/lanes.md, The deploy lane)."
