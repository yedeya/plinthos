    default: ""
  environments:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  probe:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  release:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  role:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  sha:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "::error file=.github/actions/deploy/action.yml::.github/actions/deploy/action.yml is the stub kanon init wrote: replace its step with your deploy (docs/lanes.md, The deploy lane)."
