# The deploy lane's deploy hook (docs/lanes.md, "The deploy lane"; [PLAT-4], K-SHIP-12).
#
# With probe 'true' it only runs probe.sh, which tries each listed environment's credential from
# outside the environment and writes refused, obtained or unconfigured for each to
# $RUNNER_TEMP/kanon-deploy-probe.json. Otherwise it deploys the stage `production` from the
# artifact the build hook filled: it puts the OpenNext output back in place, installs the
# project before any credential exists, assumes the deploy role with this job's OIDC token, and
# runs `sst deploy`, which builds nothing (infra/admin.ts). Then it applies every pending database
# migration through the RDS Data API, before the smoke hook runs ([PLAT-12]): the same command as
# docs/deploy.md's step 5, which a second run makes apply none. It hands the admin's address to
# the smoke hook in $RUNNER_TEMP/plinthos-admin-url.
#
# What it reads from the job's environment (docs/deploy.md, "The deploy lane"):
#   AWS_DEPLOY_ROLE_ARN        the deploy role, readable outside the environment for the probe
#   PLINTHOS_AWS_REGION        the deployment's region
#   PLINTHOS_BUDGET_LIMIT_USD  optional, the budget limit
#   PLINTHOS_AURORA_MAX_ACU    optional, Aurora's maximum capacity
# A composite action can't read the `vars` or `secrets` contexts, so every value arrives as an
# environment variable. tests/infra/deploy-hooks.test.ts holds this file to all of the above.
name: Deploy lane deploy hook
description: "Obtains the environment's cloud credential and deploys the artifact directory; with probe 'true', only tries to obtain each listed environment's credential and writes refused, obtained or unconfigured for each to $RUNNER_TEMP/kanon-deploy-probe.json."
inputs:
  artifact:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  environment:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  environments:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  probe:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  release:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  role:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  sha:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
runs:
  using: composite
  steps:
    - name: Probe each environment's credential from outside it
      if: inputs.probe == 'true'
      shell: bash
      env:
        ENVIRONMENTS: ${{ inputs.environments }}
      run: bash "$GITHUB_ACTION_PATH/probe.sh"

    - name: Check the deployment's configuration
      if: inputs.probe != 'true'
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        ARTIFACT: ${{ inputs.artifact }}
      run: |
        set -euo pipefail
        fail() { echo "::error file=.github/actions/deploy/action.yml::$1"; exit 1; }
        [ "$ENVIRONMENT" = production ] || fail "Plinthos deploys only the environment production, not '$ENVIRONMENT' ([PLAT-1])."
        [ -n "${AWS_DEPLOY_ROLE_ARN:-}" ] || fail "AWS_DEPLOY_ROLE_ARN is not in this job's environment (docs/deploy.md, The deploy lane)."
        [ -n "${PLINTHOS_AWS_REGION:-}" ] || fail "PLINTHOS_AWS_REGION is not in this job's environment (docs/deploy.md, The deploy lane)."
        [ -f "$ARTIFACT/.open-next/open-next.output.json" ] || fail "the artifact holds no OpenNext build: the build hook fills it."

    - name: Put the build back in place
      if: inputs.probe != 'true'
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact }}
      run: |
        set -euo pipefail
        rm -rf .open-next .next
        cp -R "$ARTIFACT/.open-next" .open-next
        cp -R "$ARTIFACT/.next" .next

    # Before the credential: no dependency's install script ever runs beside it.
    - name: Install the project
      if: inputs.probe != 'true'
      uses: ./.github/actions/project-setup
      with:
        lane: deploy
        install: "true"
        database: "false"

    - name: Assume the deploy role
      if: inputs.probe != 'true'
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.PLINTHOS_AWS_REGION }}
        role-session-name: plinthos-deploy
        mask-aws-account-id: true

    - name: Deploy the stage production
      if: inputs.probe != 'true'
      shell: bash
      env:
        NO_COLOR: "1"
      run: npx sst deploy --stage production

    # `sst shell` hands the migration the deployed database's ARNs in its environment, so they
    # never reach this public log (an ARN holds the account ID).
    - name: Apply the database migrations
      if: inputs.probe != 'true'
      shell: bash
      env:
        NO_COLOR: "1"
      run: npx sst shell --stage production -- npm run db:migrate

    - name: Hand the admin's address to the smoke check
      if: inputs.probe != 'true'
      shell: bash
      run: |
        set -euo pipefail
        url="$(jq -r '.adminUrl // empty' .sst/outputs.json)"
        if [ -z "$url" ]; then
          echo "::error file=.github/actions/deploy/action.yml::sst deploy wrote no adminUrl to .sst/outputs.json"
          exit 1
        fi
        printf '%s\n' "$url" > "$RUNNER_TEMP/plinthos-admin-url"
